<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 530" width="1120" height="530" font-family="sans-serif"><style>svg{--paper:#F0F2F4;--surface:#FAFBFC;--surface-2:#E5E9ED;--ink:#16202A;--muted:#596773;--line:#C5CED6;--line-strong:#8B9CAA;--mark:#9B2C39;--mark-soft:rgba(155,44,57,.09);--lock:#26596B;--lock-soft:rgba(38,89,107,.10);--shadow:0 1px 2px rgba(22,32,42,.05),0 8px 24px -12px rgba(22,32,42,.16);--serif:"Newsreader",Georgia,"Times New Roman",serif;--sans:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;--mono:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;} .bx{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.5} .bx--mark{stroke:var(--mark);fill:var(--mark-soft)} .bx--lock{stroke:var(--lock);fill:var(--lock-soft)} .bx--quiet{fill:none;stroke:var(--line);stroke-width:1.25} .bx--dash{fill:none;stroke:var(--line);stroke-width:1.25;stroke-dasharray:5 5} .bx--on{fill:var(--surface-2);stroke:var(--ink);stroke-width:1.5} .t{font-family:var(--sans);font-size:13px;font-weight:600;fill:var(--ink)} .t--sm{font-size:12px} .s{font-family:var(--sans);font-size:10.5px;font-weight:400;fill:var(--muted)} .s--mark{fill:var(--mark);font-weight:600} .lab{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.11em;fill:var(--muted)} .lab--ink{fill:var(--ink)} .lab--lock{fill:var(--lock)} .ed{fill:none;stroke:var(--line-strong);stroke-width:1.5;marker-end:url(#ah)} .ed--mark{stroke:var(--mark);marker-end:url(#ahm)} .ed--plain{fill:none;stroke:var(--line-strong);stroke-width:1.5} .ed--forbid{fill:none;stroke:var(--mark);stroke-width:1.5;stroke-dasharray:6 5;marker-end:url(#ahm)} .ah{fill:var(--line-strong)} .ahm{fill:var(--mark)} .zone{fill:var(--ink);opacity:.045} .gate{stroke:var(--lock);stroke-width:2;stroke-dasharray:7 6} .xm{stroke:var(--mark);stroke-width:3;stroke-linecap:round} .plot{stroke:var(--ink);stroke-width:2;fill:none} .plot--drift{stroke:var(--mark);stroke-width:2;fill:none;stroke-dasharray:7 5} .plot--bar{stroke:var(--lock);stroke-width:2;fill:none;stroke-dasharray:7 5} .axis{stroke:var(--line);stroke-width:1.25} .dot{fill:var(--lock)} </style><defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ahm"/></marker></defs><rect width="1120" height="530" fill="var(--paper)"/>
          

          <text class="lab" x="30" y="22">SETUP · RUNS ONCE, BEFORE ANY LOOPING</text>

          <rect class="bx" x="30" y="36" width="248" height="56" rx="5"></rect>
          <text class="t t--sm" x="44" y="60">1 · Pick the bar</text>
          <text class="s" x="44" y="78">a real paper published in that journal</text>

          <rect class="bx bx--lock" x="298" y="36" width="248" height="56" rx="5"></rect>
          <text class="t t--sm" x="312" y="60">2 · Freeze the core</text>
          <text class="s" x="312" y="78">the analysis and the claims</text>

          <rect class="bx bx--lock" x="566" y="36" width="248" height="56" rx="5"></rect>
          <text class="t t--sm" x="580" y="60">3 · Open the two logs</text>
          <text class="s" x="580" y="78">the ledger and the changelog</text>

          <rect class="bx" x="834" y="36" width="248" height="56" rx="5"></rect>
          <text class="t t--sm" x="848" y="60">4 · Check the code runs</text>
          <text class="s" x="848" y="78">every number traces to output</text>

          <line class="ed" x1="281" y1="64" x2="295" y2="64"></line>
          <line class="ed" x1="549" y1="64" x2="563" y2="64"></line>
          <line class="ed" x1="817" y1="64" x2="831" y2="64"></line>

          <text class="lab" x="30" y="132">THE LOOP · EACH TRACK RUNS UNTIL IT HITS ITS OWN EXIT</text>

          <rect class="bx--quiet" x="30" y="150" width="240" height="348" rx="6"></rect>
          <text class="lab lab--ink" x="44" y="176">SEVEN OBJECTION TRACKS</text>
          <rect class="bx--quiet" x="44" y="194" width="212" height="32" rx="4"></rect>
          <text class="t t--sm" x="58" y="215">Contribution</text>
          <rect class="bx--quiet" x="44" y="236" width="212" height="32" rx="4"></rect>
          <text class="t t--sm" x="58" y="257">Theory and mechanism</text>
          <rect class="bx--on" x="44" y="278" width="212" height="32" rx="4"></rect>
          <text class="t t--sm" x="58" y="299">Identification</text>
          <rect class="bx--quiet" x="44" y="320" width="212" height="32" rx="4"></rect>
          <text class="t t--sm" x="58" y="341">Measurement</text>
          <rect class="bx--quiet" x="44" y="362" width="212" height="32" rx="4"></rect>
          <text class="t t--sm" x="58" y="383">Alternative explanations</text>
          <rect class="bx--quiet" x="44" y="404" width="212" height="32" rx="4"></rect>
          <text class="t t--sm" x="58" y="425">Inference and power</text>
          <rect class="bx--quiet" x="44" y="446" width="212" height="32" rx="4"></rect>
          <text class="t t--sm" x="58" y="467">Presentation</text>

          <line class="ed" x1="272" y1="294" x2="326" y2="294"></line>

          <rect class="bx--dash" x="330" y="150" width="580" height="348" rx="6"></rect>
          <text class="lab lab--ink" x="346" y="176">EVERY TRACK RUNS THIS CYCLE</text>

          <rect class="bx" x="370" y="200" width="200" height="70" rx="5"></rect>
          <text class="t" x="470" y="224" text-anchor="middle">BUILDER</text>
          <text class="s" x="470" y="242" text-anchor="middle">revises this track,</text>
          <text class="s" x="470" y="257" text-anchor="middle">may add robustness checks</text>

          <rect class="bx" x="370" y="320" width="200" height="50" rx="5"></rect>
          <text class="t" x="470" y="340" text-anchor="middle">LABELS STRIPPED</text>
          <text class="s" x="470" y="357" text-anchor="middle">from both, every round</text>

          <rect class="bx bx--lock" x="370" y="420" width="200" height="70" rx="5"></rect>
          <text class="t" x="470" y="444" text-anchor="middle">THE BAR</text>
          <text class="s" x="470" y="462" text-anchor="middle">a paper that got into</text>
          <text class="s" x="470" y="477" text-anchor="middle">the journal you're aiming at</text>

          <rect class="bx bx--mark" x="660" y="300" width="220" height="100" rx="5"></rect>
          <text class="t" x="770" y="326" text-anchor="middle">REFEREE PANEL</text>
          <text class="s" x="770" y="346" text-anchor="middle">two models, two orderings</text>
          <text class="s" x="770" y="362" text-anchor="middle">“which of these two would</text>
          <text class="s" x="770" y="377" text-anchor="middle">you send to R&amp;R?”</text>

          <line class="ed" x1="470" y1="270" x2="470" y2="316"></line>
          <text class="s" x="482" y="297">your revised track</text>
          <line class="ed" x1="470" y1="420" x2="470" y2="374"></line>
          <text class="s" x="482" y="401">never changes</text>
          <line class="ed" x1="570" y1="348" x2="656" y2="348"></line>
          <text class="s" x="613" y="338" text-anchor="middle">A and B</text>

          <path class="ed ed--mark" d="M770 300 L770 246 Q770 236 760 236 L574 236"></path>
          <text class="s s--mark" x="672" y="228" text-anchor="middle">the one objection that would block it</text>

          <line class="ed" x1="880" y1="350" x2="946" y2="350"></line>
          <text class="s" x="913" y="340" text-anchor="middle">4 of 4</text>

          <rect class="bx" x="950" y="310" width="140" height="80" rx="5"></rect>
          <text class="t" x="1020" y="336" text-anchor="middle">EXIT</text>
          <text class="s" x="1020" y="356" text-anchor="middle">rules differ</text>
          <text class="s" x="1020" y="371" text-anchor="middle">by track</text>
        </svg>